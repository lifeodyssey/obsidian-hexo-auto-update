name: Release explicitly tagged Obsidian plugin

on:
  push:
    tags: ['[0-9]*']

permissions:
  contents: read

# Different versions cannot displace each other's pending publication.
# Ordinary main-branch pushes never enter this workflow.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - name: Validate explicit tag and metadata
        run: node scripts/release.mjs plan
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Validate
        run: npm run check && npm run build
      - name: Publish configured release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs publish
